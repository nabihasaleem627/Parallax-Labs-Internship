services:
  db:
    image: postgres:16-alpine
    container_name: bookflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookflow
    ports:
      - "5432:5432"
    volumes:
      # Persistent storage — data survives `docker compose down`.
      - db_data:/var/lib/postgresql/data
      # Creates the non-owner `tenant_app` role on first boot so that
      # Row-Level Security is enforced for the application.
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
